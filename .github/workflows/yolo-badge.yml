name: YOLO Badge

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  yolo-badge:
    name: Update YOLO badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate YOLO score
        id: yolo
        run: |
          # Count commits that went directly to main/master (bypassing a PR)
          # A commit is "YOLO" if it has no associated merge commit referencing a PR
          TOTAL=$(git rev-list HEAD --count)
          # Commits that have "Merge pull request" in parent commits = PR merges
          PR_MERGES=$(git log --oneline --merges | grep -c "Merge pull request" || true)
          YOLO_COMMITS=$((TOTAL - PR_MERGES))
          if [ "$TOTAL" -gt 0 ]; then
            YOLO_PCT=$(( (YOLO_COMMITS * 100) / TOTAL ))
          else
            YOLO_PCT=0
          fi
          echo "yolo_pct=$YOLO_PCT" >> "$GITHUB_OUTPUT"
          echo "yolo_commits=$YOLO_COMMITS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Pick badge colour
        id: colour
        run: |
          PCT=${{ steps.yolo.outputs.yolo_pct }}
          if [ "$PCT" -ge 80 ]; then
            echo "colour=red" >> "$GITHUB_OUTPUT"
          elif [ "$PCT" -ge 50 ]; then
            echo "colour=orange" >> "$GITHUB_OUTPUT"
          elif [ "$PCT" -ge 20 ]; then
            echo "colour=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "colour=brightgreen" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate YOLO badge (shields.io URL in README)
        run: |
          PCT=${{ steps.yolo.outputs.yolo_pct }}
          COLOUR=${{ steps.colour.outputs.colour }}
          BADGE_URL="https://img.shields.io/badge/YOLO-${PCT}%25-${COLOUR}?style=flat-square&logo=github"
          BADGE_MD="[![YOLO](${BADGE_URL})](https://github.com/${{ github.repository }})"

          # Replace existing YOLO badge line, or insert after the first heading
          if grep -q "!\[YOLO\]" README.md; then
            sed -i "s|!\[YOLO\](.*)|${BADGE_MD}|g" README.md
          else
            sed -i "1s|^|${BADGE_MD}\n\n|" README.md
          fi

      - name: Commit updated badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update YOLO badge [skip ci]"
          file_pattern: README.md
